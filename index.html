<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>污水接管意願管理平台</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <div id="app">
        <!-- Login View -->
        <div id="login-view" class="view active">
            <div class="glass-card login-card">
                <div class="logo">
                    <i data-lucide="droplets" class="icon-large text-primary"></i>
                    <h2>黎明工程顧問有限公司</h2>
                    <p style="font-weight: 500; color: var(--primary); margin-top: 5px;">汙水下水道巷弄用戶接管前後巷意見調查表</p>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label>選擇身分</label>
                        <select id="role-select" required>
                            <option value="">請選擇登入身分...</option>
                            <option value="resident">住戶端 (Resident)</option>
                            <option value="contractor">廠商端 (Contractor)</option>
                            <option value="consultant">顧問公司 (Consultant)</option>
                            <option value="admin">管理員 (Admin)</option>
                        </select>
                    </div>

                    <!-- Resident Fields -->
                    <div id="resident-fields" style="display:none;">
                        <div class="form-group">
                            <label>案名</label>
                            <select id="resident-project" required>
                                <option value="">請選擇案名...</option>
                            </select>
                        </div>
                        <div class="form-group flex-row-stack">
                            <div style="flex:1;">
                                <label>街廓</label>
                                <select id="resident-block-name" required disabled>
                                    <option value="">請選擇街廓...</option>
                                </select>
                            </div>
                            <div style="flex:1;">
                                <label>水系</label>
                                <select id="resident-water-system" required disabled>
                                    <option value="">請選擇水系...</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>住戶姓名</label>
                            <input type="text" id="resident-name" placeholder="請輸入姓名" required>
                        </div>
                        <div class="form-group">
                            <label>電話號碼 (帳號)</label>
                            <input type="tel" id="resident-phone" placeholder="例如: 0912345678" required>
                        </div>
                        <div class="form-group">
                            <label>身分證字號 (密碼)</label>
                            <input type="text" id="resident-id-number" placeholder="請輸入身分證字號" required>
                        </div>
                        <div id="address-field-container" class="form-group">
                            <label>聯絡地址</label>
                            <input type="text" id="resident-address" placeholder="請輸入您的詳細地址" required>
                        </div>
                    </div>

                    <!-- Staff Fields (Contractor, Consultant, Admin) -->
                    <div id="staff-fields" style="display:none;">
                        <div class="form-group">
                            <label>帳號 (Email/電話)</label>
                            <input type="text" id="staff-account" placeholder="請輸入帳號">
                        </div>
                        <div class="form-group">
                            <label>密碼</label>
                            <input type="password" id="staff-password" placeholder="請輸入密碼">
                        </div>
                        <div class="form-group"
                            style="display: flex; align-items: center; gap: 8px; margin-top: -10px; margin-bottom: 20px;">
                            <input type="checkbox" id="remember-me" style="width: auto;">
                            <label for="remember-me"
                                style="margin: 0; cursor: pointer; font-size: 0.85rem; color: var(--text-muted);">記住帳號與密碼</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">登入系統</button>

                    <div id="register-hint" class="text-center mt-4" style="display:none;">
                        <p class="text-sm text-muted">尚未擁有帳號？ <a href="#" id="open-register">提交使用申請</a></p>
                    </div>
                </form>
            </div>
        </div>

        <!-- Register Modal -->
        <div id="register-modal" class="modal">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h3>提交帳號申請</h3>
                    <button class="close-btn" id="close-register"><i data-lucide="x"></i></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-4">請填寫基本資料，管理員審核後即可登入。</p>
                    <form id="register-form">
                        <div class="form-group">
                            <label>身分</label>
                            <select id="reg-role" required>
                                <option value="contractor">廠商端 (Contractor)</option>
                                <option value="consultant">顧問公司 (Consultant)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>帳號 (登入時使用)</label>
                            <input type="text" id="reg-account" required placeholder="Email 或 電話">
                        </div>
                        <div class="form-group">
                            <label>設定密碼</label>
                            <input type="password" id="reg-password" required placeholder="請設定密碼">
                            <small class="text-muted" style="display: block; margin-top: 4px; font-size: 0.75rem;">※ 需包含至少 1 位英文字母，且長度至少 6 碼。</small>
                        </div>
                        <div class="form-group">
                            <label>聯絡姓名</label>
                            <input type="text" id="reg-name" required placeholder="真實姓名">
                        </div>
                        <div class="form-group">
                            <label>聯絡電話</label>
                            <input type="tel" id="reg-phone" required placeholder="電話號碼">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-4">提交申請</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main Layout (After Login) -->
        <div id="main-layout" class="view">
            <!-- Sidebar Overlay for Mobile -->
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- Sidebar -->
            <aside class="sidebar glass-panel" id="sidebar">
                <div class="sidebar-header">
                    <i data-lucide="waves" class="icon-large"></i>
                    <h3>主選單</h3>
                </div>
                <nav class="sidebar-nav" id="sidebar-nav">
                    <!-- Nav items injected by JS -->
                </nav>
                <div class="sidebar-footer">
                    <div class="user-info">
                        <i data-lucide="user-circle"></i>
                        <span id="current-user-role">Role</span>
                    </div>
                    <button id="logout-btn" class="btn btn-outline btn-sm">
                        <i data-lucide="log-out"></i> 登出
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <header class="topbar glass-panel">
                    <h2 id="page-title">儀表板</h2>
                    <div class="topbar-actions" style="display:flex; gap:10px; align-items:center;">
                        <button class="icon-btn" id="mobile-menu-btn" style="display:none;">
                            <i data-lucide="menu"></i>
                        </button>
                        <button class="icon-btn" id="notification-btn">
                            <i data-lucide="bell"></i>
                            <span class="badge" id="notification-badge" style="display:none;">0</span>
                        </button>
                    </div>
                </header>

                <div class="content-area" id="content-area">
                    <!-- Page content injected here by routing -->
                </div>
            </main>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notification-modal" class="modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>通知中心</h3>
                <button class="close-btn" id="close-notifications"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body" id="notification-list">
                <!-- Notifications injected here -->
            </div>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

    <!-- Firebase SDK (Modular ESM) -->

        // 請從這裡開始替換 (大約在 209 行)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ5PGDkSmysU7K1Oakd7LJlmVkmNNcKpk",
            authDomain: "resident-willingness-app.firebaseapp.com",
            databaseURL: "https://resident-willingness-app-default-rtdb.firebaseio.com",
            projectId: "resident-willingness-app",
            storageBucket: "resident-willingness-app.firebasestorage.app",
            messagingSenderId: "210331171941",
            appId: "1:210331171941:web:ec7baf75599a5c9461da8c"

            db: getDatabase(app),

    <!-- Scripts -->
    <script src="js/store.js?v=6" defer></script>
    <script src="js/pages/resident.js?v=6" defer></script>
    <script src="js/pages/contractor.js?v=6" defer charset="utf-8"></script>
    <script src="js/pages/consultant.js?v=6" defer></script>
    <script src="js/pages/admin.js?v=6" defer></script>
    <script src="js/app.js?v=6" defer></script>
</body>

</html>
